# Tiny Tapeout project information
project:
  title:        "Deterministic Dual-Channel RC Servo Controller"      # Project title
  author:       "Dr. M. Nisha Angeline"      
  discord:      ""      
  description:  "Two RC servo command outputs with 1 us resolution, atomic frame-boundary updates, configurable limits, keyed arming, host watchdog and readable fault status over SPI"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # tiles design. A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # top module name 
  top_module:  "tt_um_nishaangelinem_dual_servo"

  source_files:
    - "project.v"

# The pinout of the project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "HW_EN"
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "SERVO0"
  uo[1]: "SERVO1"
  uo[2]: "FRAME_SYNC"
  uo[3]: "FAULT"
  uo[4]: "WDT_EXPIRED"
  uo[5]: "ARMED"
  uo[6]: "UPDATE_PENDING"
  uo[7]: "LIMIT_HIT"

  # Bidirectional pins
  uio[0]: "CS_N"
  uio[1]: "MOSI"
  uio[2]: "MISO"
  uio[3]: "SCK"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
